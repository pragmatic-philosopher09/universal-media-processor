# Full deployment: app + Caddy (automatic HTTPS). Used by install.sh; works on any Docker host.
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: media-downloader:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      AUTO_BROWSER_COOKIES: "off"
    volumes:
      - data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
