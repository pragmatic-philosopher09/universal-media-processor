# Routes TikTok (and optionally everything) through a VPN exit outside India.
# Usage:  WIREGUARD_PRIVATE_KEY=... docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d --build
# Defaults to ProtonVPN free servers (https://account.proton.me/u/0/vpn/WireGuard -> create a config
# and copy its PrivateKey). Other providers: https://github.com/qdm12/gluetun-wiki
services:
  vpn:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-Netherlands,United States,Japan}
      FREE_ONLY: ${VPN_FREE_ONLY:-on}
      HTTPPROXY: "on"
    restart: unless-stopped

  reel-downloader:
    depends_on:
      - vpn
    environment:
      TIKTOK_PROXY: http://vpn:8888
